name: taiko-github-profile

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taiko-profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: Riiichan04/taiko-github-profile@main
        with:
          chart: charts/custom.tja
          outputs: |
            taiko/taiko.svg?background=original
            taiko/taiko-festival.svg?background=festival

      - name: Commit Taiko images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f taiko/taiko.svg taiko/taiko-festival.svg
          if git diff --cached --quiet; then
            echo "Images unchanged."
            exit 0
          fi
          git commit -m "Update Taiko images"
          git push